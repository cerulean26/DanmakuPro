name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync --group dev

      - name: Run ruff
        run: uv run ruff check src/ tests/

      # 格式检查与 lint 是两件事：ruff check 找可疑写法，ruff format 只管排版。
      # 只在本地跑过 format 而不在 CI 卡住，下一个提交就会重新漂移，
      # 所以这两条必须成对出现。
      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      # 检查范围由 pyproject.toml 的 [tool.pyright] include 决定（src + tests）。
      # 这里**不要**再写路径：命令行一旦传路径就会覆盖 include，
      # 「CI 只查 src/、本地查全项目」两套口径会立刻分叉。
      - name: Run pyright
        run: uv run pyright

  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync --group dev

      # 覆盖率的统计范围（--cov=src）与及格线（fail_under = 85）均由
      # pyproject.toml 的 [tool.coverage.report] 提供，此处不再重复传参，
      # 避免命令行与配置两处阈值不一致。
      #
      # 环境依赖说明（2026-09-15 实证，非推测）：
      # 测试套件不依赖真实 ffmpeg / ffprobe / GPU。所有外部调用均以
      # patch("subprocess.run") / patch("shutil.which") 隔离，探测函数体照常执行、
      # 但子进程是假的。把 PATH 剥到只剩系统目录（which 不到 ffmpeg/ffprobe）
      # 后重跑，结果与正常环境逐位一致（那次实验时套件为 279 passed、
      # 1424/167 = 88.27%；套件此后增长，2026-09-16 为 392 passed / 97.10%）。
      # 故 CI（无 NVIDIA GPU）的覆盖率应等于本地，阈值 85 无需按 CI 数字复核。
      #
      # -m "not gpu and not slow"：排除真机端到端用例。
      # tests/test_e2e_burn.py 会真实调用 ffmpeg/ffprobe 压制一段合成视频，
      # 而本 job **不安装 ffmpeg**（见上一条说明），故必须排除。
      # 这批用例的定位是「发布前/改动静音链路后」在本机跑的补强验证：
      #     pytest tests/test_e2e_burn.py -m slow
      # 若将来希望 CI 也覆盖它们，需先在本 job 里装 ffmpeg（gpu marker 用例
      # 仍须排除 —— runner 没有 NVIDIA GPU）。
      - name: Run pytest
        run: uv run pytest tests/ -m "not gpu and not slow"