[project]
name = "danmakupro"
version = "0.1.0"
description = "抖音直播弹幕压制工具"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "pyside6>=6.11.1",
    "pyyaml>=6.0",
    "tqdm>=4.67.3",
]

[project.scripts]
danmakupro = "danmakupro.cli:main"

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
# 显式指向项目虚拟环境，否则 pyright 解析不到第三方依赖，
# 会为每行 import 报 "Import could not be resolved"。
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/danmakupro"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU hardware",
]

# 覆盖率阈值统一在此处定义，命令行不要再传 --cov-fail-under，
# 否则两处阈值会不一致、且本地跑 pytest 时不起作用。
#
# 以下数字均为 2026-09-15 实测（pytest tests/ -m "not gpu and not slow"）：
#   总体 93.18%（1555 条语句 / 106 条未覆盖）
#   已满覆盖：core/burner.py(195)、core/pipeline.py(61)、layout/engine.py(151)、
#             config/models.py(115)、input/parser.py(32)、utils/validation.py(33)
#   薄弱点  ：encode/ffmpeg.py 83%(47) 、render/assets.py 81%(21)、
#             render/layout_builder.py 91%(17)、cli.py 81%(11)
#
# fail_under = 85 的实际余量：未覆盖语句可再增加 127 条（106 -> 233）才报警。
# 后果评估（按整块失守计算）：
#   core/burner.py   失守 -> 80.6%  会被拦住
#   render/assets.py 失守 -> 86.0%  **拦不住**（85 偏低的表现）
# 因此建议在确认后提到 90：届时余量 49 条，assets.py 失守 -> 86.0% 会被拦住，
# 但 ffmpeg.py 整块失守（106+47=153 <= 155）仍拦不住，需靠单测补足。
# 阈值调整属质量门禁变更，未经确认前保持 85。
[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
