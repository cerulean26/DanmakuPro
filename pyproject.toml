[project]
name = "danmakupro"
version = "0.1.0"
description = "抖音直播弹幕压制工具"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "pyside6>=6.11.1",
    "pyyaml>=6.0",
    "tqdm>=4.67.3",
]

[project.scripts]
danmakupro = "danmakupro.cli:main"

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
# 显式指向项目虚拟环境，否则 pyright 解析不到第三方依赖，
# 会为每行 import 报 "Import could not be resolved"。
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/danmakupro"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU hardware",
]

# 覆盖率阈值统一在此处定义，命令行不要再传 --cov-fail-under，
# 否则两处阈值会不一致、且本地跑 pytest 时不起作用。
# 85 的依据：当前实测 88.27%（1424 条语句 / 167 条未覆盖）。
# 若 core/burner.py 或 render/assets.py 任一整块失去覆盖，总体会跌到 ~82%，
# 85 卡在这条线之上，能拦住最脆弱模块的失守；同时比当前值低约 3 个点，
# 日常新增代码不会误伤（还可增加 46 条未覆盖语句才报警，即 miss 达到 214 条时触发）。
# 后续补完 burner.check() 后覆盖率约 93.9%，届时应提到 90。
[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
