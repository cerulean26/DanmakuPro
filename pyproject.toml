[project]
name = "danmakupro"
version = "0.1.0"
description = "抖音直播弹幕压制工具"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "pyside6>=6.11.1",
    "pyyaml>=6.0",
    "tqdm>=4.67.3",
]

[project.scripts]
danmakupro = "danmakupro.cli:main"

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
# 显式指向项目虚拟环境，否则 pyright 解析不到第三方依赖，
# 会为每行 import 报 "Import could not be resolved"。
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/danmakupro"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU hardware",
]

# 覆盖率阈值统一在此处定义，命令行不要再传 --cov-fail-under，
# 否则两处阈值会不一致、且本地跑 pytest 时不起作用。
#
# 以下数字均为 2026-09-15 实测（pytest tests/ -m "not gpu and not slow"）：
#   总体 96.98%（1587 条语句 / 48 条未覆盖），388 passed
#   已满覆盖（100%）的主要模块：encode/ffmpeg.py(278)、core/burner.py(195)、
#     layout/engine.py(151)、config/models.py(115)、cli.py(78)、errors.py(70)、
#     config/loader.py(64)、core/pipeline.py(61)、input/parser.py(37)、
#     utils/validation.py(33)
#   剩余薄弱点：render/assets.py 81%(21/111)、render/layout_builder.py 91%(17/189)、
#     __init__.py 64%(5/14)、logger_config.py 83%(4/24)、utils/helpers.py 92%(1/12)
#
# fail_under = 85 的实际余量：未覆盖语句还可再增加 190 条（48 -> 238）才报警。
# 余量偏大 —— 单模块整块失守已无法触发报警（assets.py 全失守后为 91.3%）。
# 建议在确认后提到 90（余量 110 条，日常迭代仍安全）或 95（余量 31 条，偏严格）。
# 阈值调整属质量门禁变更，未经确认前保持 85。
[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
